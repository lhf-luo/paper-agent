name: Live provider health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-provider-health
  cancel-in-progress: true

jobs:
  live-provider-health:
    name: Live literature and artifact providers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run network-dependent provider smoke
        env:
          PAPER_AGENT_LIVE_QUERY: stateful fuzzing
        run: npm run test:live
