name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan full Git history
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --redact --no-banner

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run quality gate
        run: npm run check

  cli-smoke:
    name: CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Web interface
        run: npm run web:build

      - name: Smoke launcher and loopback Web service
        run: npm run test:cli-smoke

  pdf-release-gate:
    name: Fixed PDF release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect PDF evaluation machinery
        id: eval-machinery
        shell: bash
        run: |
          if [ -f scripts/evaluate-pdf-assets.ts ] && [ -d eval-data/annotations ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/evaluate-pdf-assets.ts and eval-data/annotations are not part of this checkout; skipping the fixed PDF gate."
          fi

      - name: Set up Node.js
        if: steps.eval-machinery.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install Poppler
        if: steps.eval-machinery.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Restore pinned PDF cache
        if: steps.eval-machinery.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: eval-data/pdfs
          key: pdf-release-${{ runner.os }}-${{ hashFiles('eval-data/annotations/*.json') }}
          restore-keys: |
            pdf-release-${{ runner.os }}-

      - name: Install dependencies
        if: steps.eval-machinery.outputs.present == 'true'
        run: npm ci --ignore-scripts

      - name: Fetch and verify pinned PDFs
        if: steps.eval-machinery.outputs.present == 'true'
        run: npm run eval:pdf-assets:fetch

      - name: Run fixed PDF release gate
        if: steps.eval-machinery.outputs.present == 'true'
        run: npm run eval:pdf-assets:check
